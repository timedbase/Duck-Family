services:
  - type: web
    name: duckfun-family-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run api
    envVars:
      # "current" is a Goldsky tag (see subgraph/package.json's tag:goldsky
      # script), not a version -- it always points at whichever version was
      # last tagged, so a future subgraph deploy doesn't need this changed.
      - key: SUBGRAPH_URL
        value: https://api.goldsky.com/api/public/project_cmhtxnzpqm81001w94ksmgira/subgraphs/duckfun-ink/current/gn
      - key: INK_RPC_URL
        sync: false
      # Public RPC, same one the Arc contracts/subgraph were deployed/indexed
      # against (see Duck-Family-Contract's deploy-arc/deployments/arc.json).
      # sync:false for consistency with INK_RPC_URL above, not because the
      # value itself is sensitive.
      - key: ARC_RPC_URL
        sync: false
      - key: PORT
        value: "3000"
      - key: PINATA_JWT
        sync: false
      # Backs persisted token comments/chat (backend/src/db) -- nothing else
      # in the API uses this; every other read stays subgraph/RPC-sourced.
      # The Postgres itself (duckfun-comments-db, plan basic_256mb -- "starter"
      # is a legacy plan name Render rejects for new databases, which is why
      # an earlier `databases:` block here never actually provisioned one via
      # Blueprint sync) was created directly via the Render API/dashboard,
      # not by this Blueprint, so this stays a plain managed secret like the
      # other two above rather than a fromDatabase reference to a resource
      # this file doesn't actually own.
      - key: DATABASE_URL
        sync: false
      # Arc (5042) has no Goldsky subgraph support yet (confirmed by direct
      # testing -- Goldsky only has arc-testnet, a different chain). This
      # points the API at our own self-hosted graph-node instead, reachable
      # over Render's private network by service name (see the three
      # services below) -- live and indexing cleanly as of 2026-09-03.
      - key: ARC_SUBGRAPH_URL
        value: http://duckfun-graph-node:8000/subgraphs/name/duckfun-arc

  # ---- Self-hosted subgraph indexing for Arc (Goldsky doesn't support it
  # yet) -- mirrors graph-node's own reference docker-compose.yml exactly
  # (github.com/graphprotocol/graph-node/blob/master/docker/docker-compose.yml),
  # three private services (no public internet access -- only reachable from
  # other services in this Render project, plus the dashboard's Shell tab
  # for running one-off `graph deploy`/admin commands). Postgres is run
  # ourselves rather than using Render's managed Postgres product because
  # graph-node requires the database created with `C` locale/collation
  # (POSTGRES_INITDB_ARGS below) for correct indexing -- Render's managed
  # offering doesn't expose a locale option, and getting this wrong doesn't
  # fail loudly, it silently produces wrong query results in some cases.
  - type: pserv
    name: duckfun-graph-postgres
    runtime: image
    plan: starter
    image:
      url: postgres:16
    disk:
      name: duckfun-graph-postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 10
    envVars:
      # Must match postgres_user/postgres_pass/postgres_db on
      # duckfun-graph-node below exactly -- Render prompts for each
      # sync:false var once per service during Blueprint setup, so these
      # don't auto-share a value the way an env var group would.
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: PGDATA
        value: /var/lib/postgresql/data
      - key: POSTGRES_INITDB_ARGS
        value: "-E UTF8 --locale=C"

  - type: pserv
    name: duckfun-graph-ipfs
    runtime: image
    plan: starter
    image:
      url: ipfs/kubo:latest
    disk:
      name: duckfun-graph-ipfs-data
      mountPath: /data/ipfs
      sizeGB: 10

  - type: pserv
    name: duckfun-graph-node
    runtime: image
    plan: standard
    image:
      url: graphprotocol/graph-node:latest
    envVars:
      - key: postgres_host
        value: duckfun-graph-postgres
      - key: postgres_port
        value: "5432"
      # Must match POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB on
      # duckfun-graph-postgres above exactly.
      - key: postgres_user
        sync: false
      - key: postgres_pass
        sync: false
      - key: postgres_db
        sync: false
      - key: ipfs
        value: duckfun-graph-ipfs:5001
      # Network name here MUST match subgraph-arc/subgraph.yaml's every
      # `network:` field exactly (currently "arc") -- graph-node routes a
      # subgraph's data source to whichever `ethereum` entry has the
      # matching network name, comma-separate more `name:url` pairs here if
      # this node ever indexes more than one chain.
      - key: ethereum
        value: "arc:https://rpc.arc-scan.org"
      - key: GRAPH_LOG
        value: info
