databases:
  # Backs persisted token comments/chat (backend/src/db) -- nothing else in
  # the API uses this; every other read stays subgraph/RPC-sourced. Starter
  # plan, same region as the web service so the connection stays internal.
  - name: duckfun-comments-db
    plan: starter
    region: oregon

services:
  - type: web
    name: duckfun-family-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run api
    envVars:
      # "current" is a Goldsky tag (see subgraph/package.json's tag:goldsky
      # script), not a version -- it always points at whichever version was
      # last tagged, so a future subgraph deploy doesn't need this changed.
      - key: SUBGRAPH_URL
        value: https://api.goldsky.com/api/public/project_cmhtxnzpqm81001w94ksmgira/subgraphs/duckfun-ink/current/gn
      - key: INK_RPC_URL
        sync: false
      - key: PORT
        value: "3000"
      - key: PINATA_JWT
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: duckfun-comments-db
          property: connectionString
